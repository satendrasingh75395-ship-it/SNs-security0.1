<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#21123f">
<title>SNs Security 0.1</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(140deg,#17102c,#542a91);color:white;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:100%;max-width:390px;background:#ffffff12;border:1px solid #ffffff30;border-radius:22px;padding:25px;text-align:center}
.logo{font-size:45px}
h1{color:#d8c5ff}
p{line-height:1.6}
input{width:100%;padding:14px;margin:9px 0;border:0;border-radius:9px;font-size:16px}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:10px;background:#c4a5ff;color:#21123f;font-size:16px;font-weight:bold}
#status{padding:12px;margin:15px 0;background:#ffffff18;border-radius:9px;overflow-wrap:anywhere}
.small{font-size:12px;color:#ddd}
</style>
</head>
<body>
<div class="card" id="app">
<div class="logo">🔐</div>
<h1>SNs Security</h1>
<p>आपकी निजी सुरक्षा का पहला चरण</p>
<div id="status">मोबाइल नंबर डालें</div>
<input id="phone" type="tel" placeholder="+91 मोबाइल नंबर">
<div id="recaptcha-container"></div>
<button id="sendOtp">OTP भेजें</button>
<input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="6 अंकों का OTP">
<button id="verifyOtp">OTP Verify करें</button>
<p class="small">SNs-security0.1</p>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {getAuth,RecaptchaVerifier,signInWithPhoneNumber} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {getFirestore,doc,setDoc} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCSrykEJCLNeUtTY__f_UMjoPUIf9JWexw",
 authDomain:"sns-security-bfcf1.firebaseapp.com",
 projectId:"sns-security-bfcf1",
 storageBucket:"sns-security-bfcf1.firebasestorage.app",
 messagingSenderId:"293163824616",
 appId:"1:293163824616:web:dd1ac75b02c48cc3eba05d",
 measurementId:"G-47L7R6JEQL"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
let confirmationResult=null;
let verifier=null;

const status=(msg)=>{
 document.getElementById("status").textContent=msg;
};

document.getElementById("sendOtp").onclick=async()=>{
 const btn=document.getElementById("sendOtp");
 let phone=document.getElementById("phone").value.trim().replace(/\s/g,"");
 if(!phone.startsWith("+")) phone="+91"+phone.replace(/^0/,"");
 if(!/^\+91[6-9]\d{9}$/.test(phone)){
  status("सही 10 अंकों का मोबाइल नंबर डालें।");
  return;
 }
 btn.disabled=true;
 try{
  if(!verifier){
   verifier=new RecaptchaVerifier(auth,"recaptcha-container",{size:"normal"});
  }
  await verifier.render();
  confirmationResult=await signInWithPhoneNumber(auth,phone,verifier);
  status("OTP भेज दिया गया। OTP डालकर Verify करें।");
 }catch(e){
  console.error(e);
  status("OTP Error: "+e.code+" "+e.message);
  if(verifier){verifier.clear();verifier=null;}
 }finally{
  btn.disabled=false;
 }
};

document.getElementById("verifyOtp").onclick=async()=>{
 const code=document.getElementById("otp").value.trim();
 if(!confirmationResult){
  status("पहले OTP भेजें।");
  return;
 }
 if(!/^\d{6}$/.test(code)){
  status("6 अंकों का OTP डालें।");
  return;
 }
 try{
  const result=await confirmationResult.confirm(code);
  if(!result.user) throw new Error("लॉगिन नहीं हुआ");
  showPinPage();
 }catch(e){
  console.error(e);
  status("Verify Error: "+e.code+" "+e.message);
 }
};

function showPinPage(){
 document.body.innerHTML = `
 <div class="logo">🔐</div>
 <h1>अपना PIN बनाएं</h1>
 <div id="pinStatus">6 अंकों का PIN डालें।</div>
 <input id="newPin" type="password" maxlength="6" inputmode="numeric" placeholder="नया PIN">
 <input id="confirmPin" type="password" maxlength="6" inputmode="numeric" placeholder="PIN दोबारा डालें">
 <button id="savePin">PIN सेव करें</button>`;
 document.getElementById("savePin").onclick=savePin;
}

async function savePin(){
 const pin=document.getElementById("newPin").value.trim();
 const confirm=document.getElementById("confirmPin").value.trim();
 const msg=document.getElementById("pinStatus");
 const btn=document.getElementById("savePin");

 if(!/^\d{6}$/.test(pin)){
  msg.textContent="6 अंकों का PIN डालें।";
  return;
 }
 if(pin!==confirm){
  msg.textContent="दोनों PIN अलग हैं।";
  return;
 }
 const user=auth.currentUser;
 if(!user){
  msg.textContent="पहले OTP Verify करें।";
  return;
 }
 btn.disabled=true;
 try{
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const key=await crypto.subtle.importKey(
   "raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveBits"]
  );
  const bits=await crypto.subtle.deriveBits({
   name:"PBKDF2",salt,iterations:310000,hash:"SHA-256"
  },key,256);
  const saltText=btoa(String.fromCharCode(...salt));
  const hashText=btoa(String.fromCharCode(...new Uint8Array(bits)));
  await setDoc(doc(db,"users",user.uid),{
   pinSalt:saltText,pinHash:hashText
  },{merge:true});
  
document.body.innerHTML = `
<div style="background:#281344;color:white;min-height:100vh;padding:22px;text-align:center;font-family:Arial">
<h1>🔐 SNs Security</h1>
<h2>Dashboard</h2>
<p>आपका PIN सुरक्षित है।</p>

<button id="photoBtn" style="padding:16px;width:100%;margin:8px;background:#c5a2ff;border:0;border-radius:12px">📷 Photo Vault खोलें</button>

<button id="videoBtn" style="padding:16px;width:100%;margin:8px;background:#c5a2ff;border:0;border-radius:12px">🎥 Video Vault खोलें</button>

<button id="recoveryBtn" style="padding:16px;width:100%;margin:8px;background:#c5a2ff;border:0;border-radius:12px">🔑 PIN Recovery</button>

<input id="mediaFile" type="file" hidden>
<div id="vaultStatus" style="margin:15px"></div>
<div id="mediaList"></div>
</div>
`;

const vaultOpen = indexedDB.open("SNSVault", 1);

vaultOpen.onupgradeneeded = function(e) {
  const vdb = e.target.result;
  if (!vdb.objectStoreNames.contains("media")) {
    vdb.createObjectStore("media", {keyPath:"id",autoIncrement:true});
  }
};

vaultOpen.onsuccess = function(e) {
  const vdb = e.target.result;
  const status = document.getElementById("vaultStatus");
  const list = document.getElementById("mediaList");
  const fileInput = document.getElementById("mediaFile");
  let mediaType = "image";

  function showStatus(msg) {
    status.textContent = msg;
  }

  function loadMedia() {
    list.innerHTML = "";
    const tx = vdb.transaction("media","readonly");
    const req = tx.objectStore("media").getAll();

    req.onsuccess = function() {
      req.result.forEach(item => {
        const card = document.createElement("div");
        card.style.cssText =
          "background:#49316a;padding:12px;margin:12px 0;border-radius:12px";

        const name = document.createElement("p");
        name.textContent = item.name;
        card.appendChild(name);

        const preview = document.createElement(
          item.type.startsWith("video/") ? "video" : "img"
        );
        preview.src = URL.createObjectURL(item.file);
        preview.style.cssText = "max-width:100%;max-height:260px";
        if (preview.tagName === "VIDEO") preview.controls = true;
        card.appendChild(preview);

        const del = document.createElement("button");
        del.textContent = "हटाएँ";
        del.onclick = function() {
          vdb.transaction("media","readwrite")
            .objectStore("media").delete(item.id);
          setTimeout(loadMedia,200);
        };
        card.appendChild(del);
        list.appendChild(card);
      });
    };
  }

  document.getElementById("photoBtn").onclick = function() {
    mediaType = "image";
    fileInput.accept = "image/*";
    fileInput.click();
  };

  document.getElementById("videoBtn").onclick = function() {
    mediaType = "video";
    fileInput.accept = "video/*";
    fileInput.click();
  };

  fileInput.onchange = function() {
    const file = fileInput.files[0];
    if (!file) return;

    if (mediaType === "image" && !file.type.startsWith("image/")) {
      showStatus("कृपया फोटो चुनें।");
      return;
    }

    if (mediaType === "video" && !file.type.startsWith("video/")) {
      showStatus("कृपया वीडियो चुनें।");
      return;
    }

    const tx = vdb.transaction("media","readwrite");
    tx.objectStore("media").add({
      name:file.name,
      type:file.type,
      file:file
    });

    tx.oncomplete = function() {
      showStatus("फाइल सुरक्षित हो गई।");
      loadMedia();
      fileInput.value = "";
    };

    tx.onerror = function() {
      showStatus("फाइल सेव नहीं हुई। मोबाइल में जगह जाँचें।");
    };
  };

  document.getElementById("recoveryBtn").onclick = async function() {
    const user = auth.currentUser;
    if (!user) {
      showStatus("पहले मोबाइल OTP से लॉगिन करें।");
      return;
    }

    const pin = prompt("नया 6 अंकों का PIN डालें:");
    if (!pin) return;

    if (!/^[0-9]{6}$/.test(pin)) {
      showStatus("6 अंकों का PIN डालें।");
      return;
    }

    const confirmPin = prompt("नया PIN दोबारा डालें:");
    if (pin !== confirmPin) {
      showStatus("दोनों PIN अलग हैं।");
      return;
    }

    try {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const key = await crypto.subtle.importKey(
        "raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveBits"]
      );

      const bits = await crypto.subtle.deriveBits({
        name:"PBKDF2",
        salt:salt,
        iterations:310000,
        hash:"SHA-256"
      },key,256);

      const saltText = btoa(String.fromCharCode(...salt));
      const hashText = btoa(String.fromCharCode(...new Uint8Array(bits)));

      await setDoc(doc(db,"users",user.uid),{
        pinSalt:saltText,
        pinHash:hashText
      },{merge:true});

      showStatus("नया PIN सफलतापूर्वक सेव हो गया।");
    } catch(error) {
      showStatus("PIN Recovery Error: " + error.message);
    }
  };

  loadMedia();
};

vaultOpen.onerror = function() {
  document.getElementById("vaultStatus").textContent =
    "मोबाइल स्टोरेज शुरू नहीं हो पाया।";
};

 }catch(e){
  console.error(e);
  msg.textContent="PIN Error: "+e.code+" "+e.message;
 }finally{
  btn.disabled=false;
 }
}
</script>
</body>
</html>
