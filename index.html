    * {

    body {

      justify-content: center;
      font-family: Arial, sans-serif;

      background: linear-gradient(145deg, #100d20, #39216b);
    }

    .app {
      width: 100%;
      max-width: 390px;
      padding: 30px 22px;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.3);

    .logo {
      width: 78px;

      display: grid;
      place-items: center;

      background: #8b5cf6;

    }

    .version {
      color: #c4b5fd;
      font-size: 14px;
    }

    .description {
      margin: 22px 0;
      color: #e5e1f5;
      line-height: 1.8;
    }

    .status {
      margin: 20px 0;
      padding: 13px;
      border-radius: 12px;
      background: rgba(139, 92, 246, 0.17);
      color: #ddd6fe;
      font-size: 14px;
    }

    .start {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #a78bfa;
      color: #171329;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;

    .start:active {

    .note {
      margin: 20px 0 0;
      color: #c4c0d6;
      font-size: 12px;
      line-height: 1.7;
