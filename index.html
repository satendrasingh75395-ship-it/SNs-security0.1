
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171329">
  <title>SNs-security0.1</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(145deg, #100d20, #39216b);
    }

    .app {
      width: 100%;
      max-width: 390px;
      padding: 30px 22px;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.3);
    }

    .logo {
      width: 78px;
      height: 78px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background: #8b5cf6;
      font-size: 36px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 27px;
      overflow-wrap: anywhere;
    }

    .version {
      color: #c4b5fd;
      font-size: 14px;
    }

    .description {
      margin: 22px 0;
      color: #e5e1f5;
      line-height: 1.8;
    }

    .status {
      margin: 20px 0;
      padding: 13px;
      border-radius: 12px;
      background: rgba(139, 92, 246, 0.17);
      color: #ddd6fe;
      font-size: 14px;
    }

    .start {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #a78bfa;
      color: #171329;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .start:active {
      transform: scale(0.98);
    }

    .note {
      margin: 20px 0 0;
      color: #c4c0d6;
      font-size: 12px;
      line-height: 1.7;
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="logo" aria-hidden="true">🔐</div>

    <h1>SNs-security0.1</h1>
    <div class="version">Private Security App</div>

    <p class="description">
      आपकी निजी फोटो और वीडियो के लिए
      एक सुरक्षित वॉल्ट बनाने की शुरुआत।
    </p>

    <div class="status">
      शुरुआती डिज़ाइन तैयार है
    </div>

    <div style="margin-top:20px">
  <input id="phone" type="tel" placeholder="+91 मोबाइल नंबर"
    style="width:100%;padding:14px;margin-bottom:12px;box-sizing:border-box">

  <div id="recaptcha-container"></div>

  <button class="start" id="sendOtp">OTP भेजें</button>

  <input id="otp" type="text" placeholder="6 अंकों का OTP"
    style="width:100%;padding:14px;margin-top:12px;box-sizing:border-box">

  <button class="start" id="verifyOtp" style="margin-top:12px">
    OTP Verify करें
  </button>
    </div>

    <p class="note">
      अगला चरण: मोबाइल OTP लॉगिन, PIN सुरक्षा,
      रिकवरी और निजी फोटो-वीडियो वॉल्ट।
    </p>
  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {
  getAuth,
  RecaptchaVerifier,
  signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCSrykEJCLNeUtTY__f_UMjoPUIf9JWexw",
  authDomain: "sns-security-bfcf1.firebaseapp.com",
  projectId: "sns-security-bfcf1",
  storageBucket: "sns-security-bfcf1.firebasestorage.app",
  messagingSenderId: "293163824616",
  appId: "1:293163824616:web:dd1ac75b02c48cc3eba05d",
  measurementId: "G-47L7R6JEQL"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
auth.languageCode = "en";

let confirmationResult = null;
let recaptchaVerifier = null;

document.getElementById("sendOtp").addEventListener("click", async () => {
  const input = document.getElementById("phone");
  let number = input.value.trim().replace(/\s/g, "");

  if (!number.startsWith("+")) {
    number = "+91" + number.replace(/^0/, "");
  }

  if (!/^\+91[6-9]\d{9}$/.test(number)) {
    alert("Sahi 10 digit Indian mobile number dalein.");
    return;
  }

  try {
    const button = document.getElementById("sendOtp");
    button.disabled = true;

    if (!recaptchaVerifier) {
      recaptchaVerifier = new RecaptchaVerifier(
        auth,
        "recaptcha-container",
        { size: "normal" }
      );
    }

    confirmationResult = await signInWithPhoneNumber(
      auth,
      number,
      recaptchaVerifier
    );

    alert("OTP bhej diya gaya hai. SMS check karein.");
  } catch (error) {
    alert("OTP nahi bheja gaya: " + error.message);
    if (recaptchaVerifier) {
      recaptchaVerifier.clear();
      recaptchaVerifier = null;
    }
  } finally {
    document.getElementById("sendOtp").disabled = false;
  }
});

document.getElementById("verifyOtp").addEventListener("click", async () => {
  const code = document.getElementById("otp").value.trim();

  if (!confirmationResult) {
    alert("Pehle OTP bhejein.");
    return;
  }

  if (!/^\d{6}$/.test(code)) {
    alert("6 digit OTP dalein.");
    return;
  }

  try {
    const result = await confirmationResult.confirm(code);
    alert("Login safal! Mobile: " + result.user.phoneNumber);
  } catch (error) {
    alert("OTP galat hai ya expire ho gaya: " + error.message);
  }
});
  </script>
</body>
</html>
